<svg width="150" height="150" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="coloredBlur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
    </defs>

    <g>
        <circle cx="50" cy="50" r="48" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3">
             <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite" />
        </circle>
        <circle cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.5">
             <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite" />
        </circle>
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="40s" repeatCount="indefinite" />
    </g>

    <g>
        <circle cx="50" cy="50" r="35" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.7">
            <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite" />
        </circle>
        <path d="M 50 15 A 35 35 0 0 1 85 50" fill="none" stroke-width="2" stroke="#fbbf24">
             <animate attributeName="stroke" values="#fbbf24;#f59e0b;#fbbf24" dur="6s" repeatCount="indefinite" />
        </path>
        <path d="M 50 85 A 35 35 0 0 1 15 50" fill="none" stroke-width="2" stroke="#fbbf24">
            <animate attributeName="stroke" values="#fbbf24;#f59e0b;#fbbf24" dur="6s" repeatCount="indefinite" />
        </path>
        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="25s" repeatCount="indefinite" />
    </g>
    
    <circle cx="50" cy="50" r="28" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)">
        <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="1;1.05;1" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" additive="sum" begin="0s"></animateTransform>
        <animate attributeName="opacity" values="0.7;1;0.7" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="50" cy="50" r="10" fill="#f59e0b">
        <animate attributeName="fill" values="#f59e0b;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="1;0.85;1" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite" additive="sum" begin="0s"></animateTransform>
    </circle>

    <g>
        <path d="M50 22.5V15 M50 85v-7.5 M77.5 50H85 M15 50h7.5 M32.2 32.2l-5.3-5.3 M73.1 73.1l-5.3-5.3 M67.8 32.2l5.3-5.3 M26.9 73.1l5.3-5.3" fill="none" stroke="#f59e0b" stroke-width="2.5">
            <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite" />
        </path>
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite" />
    </g>
</svg>
